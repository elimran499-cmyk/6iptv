<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deutscher IPTV Anbieter | Smart IPTV App | 6IPTV</title>
    <meta
      name="description"
      content="6IPTV: +80.000 Sender und +200.000 Filme & Serien in SD, HD, FHD und UHD. Blitzschnelle Aktivierung, 24/7 Premium Support, kostenloser VPN Zugang. Pakete ab 19.99 € einmalig."
    />
    <link rel="canonical" href="https://6iptv.app/" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/manrope-latin.woff2" />

    <!-- Favicon als PNG voran, .ico nur noch als Rueckfall fuer alte
         Browser: PNG ist das Format, das Google fuer das Suchergebnis-Icon
         einliest und indexieren kann. Transparenter Grund, damit die Marke
         auf hellen wie dunklen Tabs sitzt.
         ?v=2 erzwingt ein Neuladen — die Pfade aendern sich nie, und
         Browser halten das alte Icon hartnaeckig fest. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <meta name="theme-color" content="#fff7ef" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:url" content="https://6iptv.app/" />
    <meta property="og:site_name" content="6IPTV" />
    <meta property="og:title" content="Deutscher IPTV Anbieter | Smart IPTV App | 6IPTV" />
    <meta
      property="og:description"
      content="+80.000 Sender und +200.000 Filme & Serien in SD bis UHD. Blitzschnelle Aktivierung, 24/7 Support, kostenloser VPN Zugang."
    />
    <meta property="og:image" content="https://6iptv.app/logo.png" />
    <meta property="og:image:alt" content="6IPTV — Premium IPTV" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://6iptv.app/logo.png" />

    <!-- Das Logo als eigene Bilddatei anzumelden ist der Grund, warum es
         ueberhaupt als PNG vorliegt: Google zieht `logo` fuer die
         Wissenskarte heran, und eine Inline-SVG koennte hier nicht stehen. -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "name": "6IPTV",
      "logo": "https://6iptv.app/logo.png",
      "image": ["https://6iptv.app/logo.png", "https://6iptv.app/logo-mark.png"],
      "description": "Premium IPTV aus Deutschland: +80.000 Sender und +200.000 Filme & Serien in SD bis UHD."
    },
    { "@type": "WebSite", "name": "6IPTV", "url": "https://6iptv.app/", "inLanguage": "de" }
  ]
}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
