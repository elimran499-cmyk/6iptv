    <!-- Favicon als PNG voran, .ico nur noch als Rueckfall fuer alte
         Browser: PNG ist das Format, das Google fuer das Suchergebnis-Icon
         einliest und indexieren kann. Transparenter Grund, damit die Marke
         auf hellen wie dunklen Tabs sitzt.
         ?v=2 erzwingt ein Neuladen — die Pfade aendern sich nie, und
         Browser halten das alte Icon hartnaeckig fest. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />

    <!-- Das Logo als eigene Bilddatei anzumelden ist der Grund, warum es
